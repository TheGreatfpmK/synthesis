name: StormPy pre-release

on:
  schedule:
    # Check for a new stormpy every day.
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: stormpy-pre-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  create_pre_release_branch:
    name: Create or update pre-release branch when stormpy advances
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # TEMPORARY for fork testing only - revert before merging back.
    if: github.repository == 'randriu/paynt' || github.repository == 'TheGreatfpmK/paynt'
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PROBE_BRANCH: stormpy-pre-release-probe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name 'PAYNT release bot'
          git config user.email 'imacak@fit.vut.cz'

      - name: Resolve pre-release branch and stormpy versions
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          def show(ref, path):
              return subprocess.run(
                  ["git", "show", f"{ref}:{path}"],
                  check=True, capture_output=True, text=True,
              ).stdout

          def parse_version(text):
              match = re.search(
                  r'__version__ = "([0-9]+)\.([0-9]+)\.([0-9]+)(?:\.dev([0-9]+))?"',
                  text,
              )
              if not match:
                  raise SystemExit(f"Could not parse version from: {text!r}")
              major, minor, patch = map(int, match.group(1, 2, 3))
              dev = int(match.group(4)) if match.group(4) else None
              return major, minor, patch, dev

          output_path = Path(os.environ["GITHUB_OUTPUT"])

          stable_major, stable_minor, stable_patch, _ = parse_version(
              show("origin/stable", "paynt/_version.py")
          )
          target_base = f"{stable_major}.{stable_minor}.{stable_patch + 1}"
          target_branch = f"{target_base}-pre-release"

          pyproject_text = show("origin/stable", "pyproject.toml")
          current_match = re.search(
              r'stormpy\s*(?:==|>=|<=|~=|>|<)\s*([0-9]+\.[0-9]+\.[0-9]+)',
              pyproject_text,
          )
          if not current_match:
              raise SystemExit("Could not parse stormpy version from pyproject.toml on stable")
          current_stormpy = current_match.group(1)

          with urllib.request.urlopen("https://pypi.org/pypi/stormpy/json") as response:
              latest_stormpy = json.load(response)["info"]["version"]

          if current_stormpy == latest_stormpy:
              with output_path.open("a") as output:
                  output.write("changed=false\n")
              raise SystemExit(0)

          branch_exists = (
              subprocess.run(
                  ["git", "ls-remote", "--exit-code", "--heads", "origin", target_branch],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode
              == 0
          )

          if branch_exists:
              _, _, _, existing_dev = parse_version(show(f"origin/{target_branch}", "paynt/_version.py"))
              new_dev = (existing_dev or 0) + 1
          else:
              new_dev = 1
          new_version = f"{target_base}.dev{new_dev}"

          with output_path.open("a") as output:
              output.write("changed=true\n")
              output.write(f"target_branch={target_branch}\n")
              output.write(f"latest_stormpy={latest_stormpy}\n")
              output.write(f"new_version={new_version}\n")
          PY

      - name: Try stable as pre-release base
        id: try_stable
        if: steps.resolve.outputs.changed == 'true'
        shell: bash
        env:
          LATEST_STORMPY: ${{ steps.resolve.outputs.latest_stormpy }}
          NEW_VERSION: ${{ steps.resolve.outputs.new_version }}
        run: |
          set -euo pipefail

          git checkout -B "$PROBE_BRANCH" origin/stable

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          latest_stormpy = os.environ["LATEST_STORMPY"]
          new_version = os.environ["NEW_VERSION"]

          pyproject_path = Path("pyproject.toml")
          pyproject_text = pyproject_path.read_text()
          updated_pyproject_text = re.sub(
              r'stormpy\s*(?:==|>=|<=|~=|>|<)\s*[0-9]+\.[0-9]+\.[0-9]+',
              f'stormpy=={latest_stormpy}',
              pyproject_text,
          )
          if updated_pyproject_text == pyproject_text:
              raise SystemExit("Did not update stormpy pin in pyproject.toml")
          pyproject_path.write_text(updated_pyproject_text)

          for version_file in [Path("paynt/_version.py"), Path("payntbind/lib/payntbind/_version.py")]:
              version_file.write_text(f'__version__ = "{new_version}"\n')
          PY

          git add pyproject.toml paynt/_version.py payntbind/lib/payntbind/_version.py
          git commit -m "release: ${NEW_VERSION} with stormpy ${LATEST_STORMPY} (base: stable)"
          git push --force origin "HEAD:refs/heads/${PROBE_BRANCH}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          gh workflow run ci_stable.yml --ref "$PROBE_BRANCH"

          run_id=""
          for _ in $(seq 1 12); do
            sleep 10
            run_id="$(gh run list --workflow ci_stable.yml --branch "$PROBE_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "$run_id" ]]; then
              break
            fi
          done

          if [[ -z "$run_id" ]]; then
            echo "::warning::Could not find the dispatched CI run for $PROBE_BRANCH"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Waiting for CI run $run_id on $PROBE_BRANCH to finish..."
          if gh run watch "$run_id" --exit-status; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check master's latest CI status
        id: check_master
        if: steps.resolve.outputs.changed == 'true' && steps.try_stable.outputs.passed != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Fetch the recent runs ourselves rather than relying on gh's
          # --status filter, and pick the newest completed one by createdAt -
          # easier to log/debug if this ever disagrees with what's on GitHub.
          runs_json="$(gh run list --workflow ci_stable.yml --branch master --limit 10 --json databaseId,status,conclusion,createdAt,url)"
          echo "Recent ci_stable.yml runs on master:"
          echo "$runs_json" | python3 -m json.tool 2>/dev/null || echo "$runs_json"

          ok="$(echo "$runs_json" | python3 -c '
          import json, sys

          runs = json.load(sys.stdin)
          completed = [r for r in runs if r["status"] == "completed"]
          completed.sort(key=lambda r: r["createdAt"], reverse=True)
          print("true" if completed and completed[0]["conclusion"] == "success" else "false")
          ')"
          echo "ok=$ok"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release branch from stable
        if: steps.try_stable.outputs.passed == 'true'
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.resolve.outputs.target_branch }}
          NEW_VERSION: ${{ steps.resolve.outputs.new_version }}
          LATEST_STORMPY: ${{ steps.resolve.outputs.latest_stormpy }}
          COMMIT_SHA: ${{ steps.try_stable.outputs.commit_sha }}
        run: |
          set -euo pipefail
          git push --force origin "${COMMIT_SHA}:refs/heads/${TARGET_BRANCH}"
          echo "### stormpy pre-release updated" >> "$GITHUB_STEP_SUMMARY"
          echo "Published \`${TARGET_BRANCH}\` (${NEW_VERSION}) based on \`stable\` with stormpy ${LATEST_STORMPY}." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish pre-release branch from master
        if: steps.resolve.outputs.changed == 'true' && steps.try_stable.outputs.passed != 'true' && steps.check_master.outputs.ok == 'true'
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.resolve.outputs.target_branch }}
          NEW_VERSION: ${{ steps.resolve.outputs.new_version }}
          LATEST_STORMPY: ${{ steps.resolve.outputs.latest_stormpy }}
        run: |
          set -euo pipefail

          git checkout -B "$TARGET_BRANCH" origin/master

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          latest_stormpy = os.environ["LATEST_STORMPY"]
          new_version = os.environ["NEW_VERSION"]

          pyproject_path = Path("pyproject.toml")
          pyproject_text = pyproject_path.read_text()
          updated_pyproject_text = re.sub(
              r'stormpy\s*(?:==|>=|<=|~=|>|<)\s*[0-9]+\.[0-9]+\.[0-9]+',
              f'stormpy=={latest_stormpy}',
              pyproject_text,
          )
          if updated_pyproject_text == pyproject_text:
              raise SystemExit("Did not update stormpy pin in pyproject.toml")
          pyproject_path.write_text(updated_pyproject_text)

          for version_file in [Path("paynt/_version.py"), Path("payntbind/lib/payntbind/_version.py")]:
              version_file.write_text(f'__version__ = "{new_version}"\n')
          PY

          git add pyproject.toml paynt/_version.py payntbind/lib/payntbind/_version.py
          git commit -m "release: ${NEW_VERSION} with stormpy ${LATEST_STORMPY} (base: master)"
          git push --force origin "HEAD:refs/heads/${TARGET_BRANCH}"

          echo "### stormpy pre-release updated" >> "$GITHUB_STEP_SUMMARY"
          echo "Published \`${TARGET_BRANCH}\` (${NEW_VERSION}) based on \`master\` (last CI on master was green) with stormpy ${LATEST_STORMPY}." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if neither stable nor master is compatible
        if: steps.resolve.outputs.changed == 'true' && steps.try_stable.outputs.passed != 'true' && steps.check_master.outputs.ok != 'true'
        shell: bash
        env:
          LATEST_STORMPY: ${{ steps.resolve.outputs.latest_stormpy }}
        run: |
          set -euo pipefail
          message="stormpy ${LATEST_STORMPY} is incompatible with both \`stable\` and \`master\` (master's latest CI run is not green). Update \`master\` to support stormpy ${LATEST_STORMPY}, then re-run this workflow (workflow_dispatch) to retry."
          echo "### stormpy pre-release check failed" >> "$GITHUB_STEP_SUMMARY"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$message"
          exit 1

      - name: Clean up probe branch
        if: always() && steps.resolve.outputs.changed == 'true'
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin "$PROBE_BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$PROBE_BRANCH"
          fi